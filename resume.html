<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hari Hrithik RA - Resume (PDF)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css" />
  
  <style>
    body, html {
      height: 100%;
      margin: 0;
      background-color: #090a0f;
      color: #f8fafc;
    }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- Top Action Toolbar -->
  <header class="bg-[#0e1017] border-b border-white/[0.08] px-4 sm:px-8 py-3 flex items-center justify-between z-10 shrink-0">
    <div class="flex items-center gap-3">
      <a href="index.html" class="px-3.5 py-1.5 rounded-lg bg-white/[0.06] hover:bg-white/[0.1] text-xs font-semibold flex items-center gap-1.5 transition-colors text-slate-200">
        <i data-lucide="arrow-left" class="w-4 h-4 text-indigo-400"></i>
        <span>Back to Portfolio</span>
      </a>
      <span class="hidden sm:inline-block text-xs text-slate-400 font-mono">Hari_Hrithik_Resume.pdf</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Direct Download Button -->
      <a href="Hari_Hrithik_Resume.pdf" download="Hari_Hrithik_Resume.pdf" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-lg shadow-md shadow-indigo-600/25 flex items-center gap-2 transition-all">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span>Download PDF</span>
      </a>

      <!-- Open Raw File in Tab -->
      <a href="Hari_Hrithik_Resume.pdf" target="_blank" class="px-3.5 py-2 bg-white/[0.08] hover:bg-white/[0.12] text-slate-200 font-semibold text-xs rounded-lg flex items-center gap-2 transition-all">
        <i data-lucide="external-link" class="w-4 h-4"></i>
        <span>Open Raw PDF</span>
      </a>
    </div>
  </header>

  <!-- Embedded PDF Canvas Frame -->
  <main class="flex-1 w-full h-full bg-[#12141c] p-2 sm:p-4 flex items-center justify-center">
    <object data="Hari_Hrithik_Resume.pdf#toolbar=1&navpanes=0" type="application/pdf" class="w-full h-full rounded-xl border border-white/[0.08] shadow-2xl">
      <div class="flex flex-col items-center justify-center p-8 text-center bg-[#0e1017] rounded-xl border border-white/[0.08] max-w-md mx-auto my-auto">
        <i data-lucide="file-text" class="w-12 h-12 text-indigo-400 mb-4"></i>
        <h3 class="text-lg font-bold text-white mb-2">Hari Hrithik RA — Resume</h3>
        <p class="text-xs text-slate-400 mb-6">
          Your browser does not support inline PDF viewing. Click below to download or view the exact resume PDF.
        </p>
        <a href="Hari_Hrithik_Resume.pdf" download="Hari_Hrithik_Resume.pdf" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm rounded-lg flex items-center gap-2">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>Download Hari_Hrithik_Resume.pdf</span>
        </a>
      </div>
    </object>
  </main>

  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
